<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Divider lines -->
  <line x1="340" y1="20" x2="340" y2="320" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="20" y1="170" x2="660" y2="170" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Diagram (A) -->
  <text x="40" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">(A)</text>
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <circle cx="170" cy="95" r="65" fill="#f8fafc"/>
    <circle cx="175" cy="115" r="22" fill="#ffffff"/>
  </g>
  <text x="245" y="55" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">NP</text>
  <text x="140" y="65" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">P</text>
  <text x="175" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">NPC</text>

  <!-- Diagram (B) -->
  <text x="380" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">(B)</text>
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <circle cx="460" cy="95" r="45" fill="#f8fafc" fill-opacity="0.6"/>
    <circle cx="520" cy="95" r="45" fill="#f8fafc" fill-opacity="0.6"/>
    <line x1="490" y1="145" x2="490" y2="105" marker-end="url(#arrow)"/>
  </g>
  <text x="435" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">P</text>
  <text x="545" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">NP</text>
  <text x="490" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">NPC</text>

  <!-- Diagram (C) -->
  <text x="40" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">(C)</text>
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <circle cx="170" cy="255" r="65" fill="#f8fafc"/>
    <circle cx="145" cy="225" r="22" fill="#ffffff"/>
  </g>
  <text x="245" y="215" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">P=NP</text>
  <text x="145" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">NPC</text>

  <!-- Diagram (D) -->
  <text x="380" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">(D)</text>
  <g stroke="#2563eb" stroke-width="2.5" fill="none">
    <circle cx="490" cy="255" r="65" fill="#eff6ff"/>
  </g>
  <text x="545" y="215" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">P=NP=NPC</text>
</svg>