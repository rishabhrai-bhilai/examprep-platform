<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Main Mux Box -->
  <rect x="170" y="35" width="150" height="180" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" rx="6"/>
  
  <text x="245" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">4-to-1</text>
  <text x="245" y="134" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Multiplexer</text>

  <!-- Inputs on Left -->
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <line x1="110" y1="60" x2="166" y2="60" marker-end="url(#arrow)"/>
    <line x1="110" y1="100" x2="166" y2="100" marker-end="url(#arrow)"/>
    <line x1="110" y1="140" x2="166" y2="140" marker-end="url(#arrow)"/>
    <line x1="110" y1="180" x2="166" y2="180" marker-end="url(#arrow)"/>
  </g>

  <!-- Left Pin Numbers inside Box -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">
    <text x="178" y="65">0</text>
    <text x="178" y="105">1</text>
    <text x="178" y="145">2</text>
    <text x="178" y="185">3</text>
  </g>

  <!-- Left Input Labels -->
  <g font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="end">
    <text x="95" y="66">0</text>
    <text x="95" y="106">1</text>
    <text x="95" y="146">R</text>
    <text x="95" y="186" text-decoration="overline">R</text>
  </g>

  <!-- Select Lines at Bottom -->
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <line x1="215" y1="255" x2="215" y2="219" marker-end="url(#arrow)"/>
    <line x1="275" y1="255" x2="275" y2="219" marker-end="url(#arrow)"/>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">
    <text x="215" y="205">S₁</text>
    <text x="275" y="205">S₀</text>
  </g>
  <g font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="215" y="280">P</text>
    <text x="275" y="280">Q</text>
  </g>

  <!-- Output on Right -->
  <g stroke="#1e293b" stroke-width="2.5" fill="none">
    <line x1="320" y1="125" x2="386" y2="125" marker-end="url(#arrow)"/>
  </g>
  <text x="405" y="132" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">F</text>
</svg>