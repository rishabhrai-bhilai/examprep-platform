<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" style="background:#ffffff; font-family: 'Times New Roman', Times, serif;">
  <!-- Edges -->
  <g stroke="#0f172a" stroke-width="2.5">
    <line x1="60" y1="160" x2="160" y2="70"/>
    <line x1="60" y1="160" x2="160" y2="250"/>
    <line x1="160" y1="70" x2="160" y2="250"/>
    <line x1="160" y1="70" x2="360" y2="70"/>
    <line x1="160" y1="250" x2="360" y2="250"/>
    <line x1="360" y1="70" x2="360" y2="250"/>
    <line x1="360" y1="70" x2="460" y2="160"/>
    <line x1="360" y1="250" x2="460" y2="160"/>
  </g>

  <!-- Edge Weights -->
  <text x="96" y="222" font-size="20" font-weight="bold" fill="#0f172a">9</text>
  <text x="172" y="166" font-size="20" font-weight="bold" fill="#0f172a">2</text>
  <text x="252" y="58" font-size="20" font-weight="bold" fill="#0f172a">15</text>
  <text x="420" y="108" font-size="20" font-weight="bold" fill="#0f172a">4</text>
  <text x="420" y="222" font-size="20" font-weight="bold" fill="#0f172a">6</text>

  <!-- Vertices -->
  <g stroke="#0f172a" stroke-width="2" fill="#ffffff">
    <circle cx="60" cy="160" r="18"/>
    <circle cx="160" cy="70" r="18"/>
    <circle cx="160" cy="250" r="18"/>
    <circle cx="360" cy="70" r="18"/>
    <circle cx="360" cy="250" r="18"/>
    <circle cx="460" cy="160" r="18"/>
  </g>

  <!-- Vertex Labels -->
  <text x="60" y="167" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">A</text>
  <text x="160" y="77" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">B</text>
  <text x="160" y="257" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">C</text>
  <text x="360" y="77" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">E</text>
  <text x="360" y="257" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">D</text>
  <text x="460" y="167" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">F</text>
</svg>