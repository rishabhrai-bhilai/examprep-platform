<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" style="background:#ffffff; font-family: 'Times New Roman', Times, serif;">
  <!-- Edges -->
  <g stroke="#334155" stroke-width="2.5">
    <!-- Bottom node p to q, r, s -->
    <line x1="200" y1="260" x2="100" y2="160"/>
    <line x1="200" y1="260" x2="200" y2="160"/>
    <line x1="200" y1="260" x2="300" y2="160"/>
    <!-- Top node t from q, r, s -->
    <line x1="100" y1="160" x2="200" y2="60"/>
    <line x1="200" y1="160" x2="200" y2="60"/>
    <line x1="300" y1="160" x2="200" y2="60"/>
  </g>

  <!-- Nodes (solid filled dots) -->
  <circle cx="200" cy="260" r="6" fill="#0f172a"/>
  <circle cx="100" cy="160" r="6" fill="#0f172a"/>
  <circle cx="200" cy="160" r="6" fill="#0f172a"/>
  <circle cx="300" cy="160" r="6" fill="#0f172a"/>
  <circle cx="200" cy="60" r="6" fill="#0f172a"/>

  <!-- Labels -->
  <text x="200" y="290" text-anchor="middle" font-size="22" font-style="italic" font-weight="bold" fill="#0f172a">p</text>
  <text x="75" y="167" text-anchor="middle" font-size="22" font-style="italic" font-weight="bold" fill="#0f172a">q</text>
  <text x="222" y="167" text-anchor="middle" font-size="22" font-style="italic" font-weight="bold" fill="#0f172a">r</text>
  <text x="325" y="167" text-anchor="middle" font-size="22" font-style="italic" font-weight="bold" fill="#0f172a">s</text>
  <text x="200" y="42" text-anchor="middle" font-size="22" font-style="italic" font-weight="bold" fill="#0f172a">t</text>
</svg>