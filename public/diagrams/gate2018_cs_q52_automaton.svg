<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="160">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Start Arrow -->
  <line x1="30" y1="80" x2="68" y2="80" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- State q0 (Double circle, Accepting) -->
  <circle cx="90" cy="80" r="22" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <circle cx="90" cy="80" r="17" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" />

  <!-- Transition q0 -> q1 (0) -->
  <line x1="112" y1="80" x2="186" y2="80" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="150" y="72" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">0</text>

  <!-- State q1 (Double circle, Accepting) -->
  <circle cx="210" cy="80" r="22" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <circle cx="210" cy="80" r="17" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" />

  <!-- Transition q1 -> q2 (top arc, 0) -->
  <path d="M 226 65 C 250 35, 290 35, 314 65" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="270" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">0</text>

  <!-- Transition q2 -> q1 (bottom arc, 0) -->
  <path d="M 314 95 C 290 125, 250 125, 226 95" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="270" y="132" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">0</text>

  <!-- State q2 (Single circle, Non-accepting) -->
  <circle cx="330" cy="80" r="22" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
</svg>