<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="100%" height="300">
  <defs>
    <style>
      .edge { stroke: #1e293b; stroke-width: 3.5; stroke-linecap: round; }
      .node { fill: #ffffff; stroke: #1e293b; stroke-width: 3.5; }
      .weight { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
      .weight-var { font-family: 'Times New Roman', serif; font-size: 21px; font-style: italic; font-weight: bold; fill: #1e293b; }
    </style>
  </defs>

  <!-- Outer Pentagon Edges -->
  <line x1="230" y1="60" x2="110" y2="150" class="edge" />
  <line x1="110" y1="150" x2="160" y2="290" class="edge" />
  <line x1="160" y1="290" x2="300" y2="290" class="edge" />
  <line x1="300" y1="290" x2="350" y2="150" class="edge" />
  <line x1="230" y1="60" x2="350" y2="150" class="edge" />

  <!-- Internal Chords -->
  <line x1="230" y1="60" x2="160" y2="290" class="edge" />
  <line x1="230" y1="60" x2="300" y2="290" class="edge" />

  <!-- Weights -->
  <text x="155" y="95" class="weight">4</text>
  <text x="115" y="235" class="weight">4</text>
  <text x="225" y="315" class="weight">4</text>
  <text x="340" y="235" class="weight">5</text>
  <text x="300" y="95" class="weight-var">x</text>

  <!-- Chord Weights -->
  <text x="178" y="170" class="weight">1</text>
  <text x="268" y="165" class="weight">3</text>

  <!-- Nodes -->
  <circle cx="230" cy="60" r="22" class="node" />
  <circle cx="110" cy="150" r="22" class="node" />
  <circle cx="160" cy="290" r="22" class="node" />
  <circle cx="300" cy="290" r="22" class="node" />
  <circle cx="350" cy="150" r="22" class="node" />
</svg>