<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" style="background:#ffffff; font-family: 'Times New Roman', Times, serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Block 1 -->
  <text x="142" y="55" font-size="20" font-weight="bold" fill="#0f172a">1</text>
  <rect x="165" y="20" width="130" height="75" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="230" y="42" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">p = q + r</text>
  <text x="230" y="64" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">s = p + q</text>
  <text x="230" y="86" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">u = s * v</text>

  <!-- Block 2 -->
  <text x="32" y="172" font-size="20" font-weight="bold" fill="#0f172a">2</text>
  <rect x="52" y="145" width="130" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="117" y="172" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">v = r + u</text>

  <!-- Block 3 -->
  <text x="268" y="172" font-size="20" font-weight="bold" fill="#0f172a">3</text>
  <rect x="288" y="145" width="130" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="353" y="172" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">q = s * u</text>

  <!-- Block 4 -->
  <text x="148" y="272" font-size="20" font-weight="bold" fill="#0f172a">4</text>
  <rect x="168" y="245" width="130" height="42" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="233" y="272" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">q = v + r</text>

  <!-- Arrows -->
  <!-- Block 1 to Block 2 -->
  <line x1="205" y1="95" x2="140" y2="143" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Block 1 to Block 3 -->
  <line x1="255" y1="95" x2="320" y2="143" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Block 2 to Block 4 -->
  <line x1="140" y1="187" x2="200" y2="243" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Block 3 to Block 4 -->
  <line x1="325" y1="187" x2="265" y2="243" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Back edge: Block 4 to Block 1 -->
  <path d="M 298 266 C 470 266, 470 58, 298 58" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>