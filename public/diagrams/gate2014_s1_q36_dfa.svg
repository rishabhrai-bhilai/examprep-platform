<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Start Arrow -->
  <line x1="60" y1="100" x2="106" y2="100" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Transitions -->
  <g stroke="#1e293b" stroke-width="2.5" fill="none">
    <!-- Left state self loop (0) -->
    <path d="M 122,78 C 105,30 155,30 138,78" marker-end="url(#arrow)"/>
    <!-- Left to Right curved down (1) -->
    <path d="M 152,110 Q 230,155 308,110" marker-end="url(#arrow)"/>
    <!-- Right to Left curved up (0) -->
    <path d="M 308,90 Q 230,45 152,90" marker-end="url(#arrow)"/>
    <!-- Right state self loop (1) -->
    <path d="M 322,78 C 305,30 355,30 338,78" marker-end="url(#arrow)"/>
  </g>

  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">
    <text x="110" y="45">0</text>
    <text x="230" y="58">0</text>
    <text x="230" y="160">1</text>
    <text x="350" y="45">1</text>
  </g>

  <!-- States -->
  <g stroke="#1e293b" stroke-width="2" fill="#f8fafc">
    <circle cx="130" cy="100" r="24"/>
    <circle cx="330" cy="100" r="24"/>
    <circle cx="330" cy="100" r="19" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>