<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <defs>
    <marker id="dp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Left Branch: Register RA & Immediate -->
  <rect x="50" y="40" width="100" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="68" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">RA (32-bit)</text>

  <rect x="180" y="40" width="110" height="45" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="235" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="semibold" fill="#334155" text-anchor="middle">Immediate_A</text>

  <!-- Mux A (trapezoid) -->
  <polygon points="90,130 240,130 210,175 120,175" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="165" y="157" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Mux_A</text>

  <line x1="100" y1="85" x2="125" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#dp-arrow)"/>
  <line x1="235" y1="85" x2="205" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <!-- Right Branch: Register RB & Immediate -->
  <rect x="330" y="40" width="100" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="380" y="68" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">RB (32-bit)</text>

  <rect x="460" y="40" width="110" height="45" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="515" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="semibold" fill="#334155" text-anchor="middle">Immediate_B</text>

  <!-- Mux B (trapezoid) -->
  <polygon points="370,130 520,130 490,175 400,175" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="445" y="157" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Mux_B</text>

  <line x1="380" y1="85" x2="405" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#dp-arrow)"/>
  <line x1="515" y1="85" x2="485" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <!-- ALU (classic indented V-shape polygon) -->
  <polygon points="210,215 400,215 370,285 320,285 305,260 290,285 240,285" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="305" y="245" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e1b4b" text-anchor="middle">ALU</text>

  <!-- Mux outputs into ALU -->
  <line x1="165" y1="175" x2="250" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#dp-arrow)"/>
  <line x1="445" y1="175" x2="360" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <!-- ALU output into Register RZ -->
  <line x1="305" y1="285" x2="305" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <!-- Destination Register RZ -->
  <rect x="250" y="320" width="110" height="44" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="305" y="347" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">RZ (32-bit)</text>
</svg>
