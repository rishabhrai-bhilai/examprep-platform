<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="460" height="340">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Edges -->
  <!-- A - B (weight 7) -->
  <line x1="120" y1="70" x2="340" y2="70" stroke="#334155" stroke-width="2.5"/>
  <rect x="215" y="52" width="30" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="230" y="68" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">7</text>

  <!-- A - D (weight 6) -->
  <line x1="120" y1="70" x2="120" y2="270" stroke="#334155" stroke-width="2.5"/>
  <rect x="95" y="159" width="30" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="110" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">6</text>

  <!-- D - C (weight 8) -->
  <line x1="120" y1="270" x2="340" y2="270" stroke="#334155" stroke-width="2.5"/>
  <rect x="215" y="260" width="30" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="230" y="276" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">8</text>

  <!-- B - C (weight x) -->
  <line x1="340" y1="70" x2="340" y2="270" stroke="#ef4444" stroke-width="3"/>
  <rect x="345" y="159" width="30" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="360" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">x</text>

  <!-- A - C (diagonal, weight 1) -->
  <line x1="120" y1="70" x2="340" y2="270" stroke="#10b981" stroke-width="2.5"/>
  <rect x="250" y="195" width="28" height="22" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="264" y="211" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">1</text>

  <!-- B - D (diagonal, weight 3) -->
  <line x1="340" y1="70" x2="120" y2="270" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="180" y="195" width="28" height="22" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="194" y="211" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">3</text>

  <!-- Nodes A, B, C, D -->
  <!-- Node A -->
  <circle cx="120" cy="70" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="120" y="76" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>

  <!-- Node B -->
  <circle cx="340" cy="70" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="340" y="76" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">B</text>

  <!-- Node D -->
  <circle cx="120" cy="270" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="120" y="276" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">D</text>

  <!-- Node C -->
  <circle cx="340" cy="270" r="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="340" y="276" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">C</text>

  <text x="230" y="320" font-family="system-ui, sans-serif" font-size="12" font-weight="semibold" fill="#64748b" text-anchor="middle">
    For edge (B, C) with weight x to be in every MST, x &lt; bottleneck(B-D-A-C) = 6. Max integer x = 5.
  </text>
</svg>
