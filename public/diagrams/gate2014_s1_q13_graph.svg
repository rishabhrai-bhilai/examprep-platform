<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="380" height="280">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  
  <!-- Edges -->
  <g stroke="#1e293b" stroke-width="2.5" fill="none">
    <!-- P -> Q -->
    <line x1="124" y1="80" x2="246" y2="80" marker-end="url(#arrow)"/>
    <!-- P -> R -->
    <line x1="100" y1="104" x2="100" y2="186" marker-end="url(#arrow)"/>
    <!-- R -> Q -->
    <line x1="118" y1="192" x2="242" y2="98" marker-end="url(#arrow)"/>
    <!-- S -> R -->
    <line x1="246" y1="210" x2="124" y2="210" marker-end="url(#arrow)"/>
    <!-- S -> Q -->
    <line x1="270" y1="186" x2="270" y2="104" marker-end="url(#arrow)"/>
  </g>

  <!-- Nodes -->
  <g stroke="#1e293b" stroke-width="2.5" fill="#f8fafc">
    <circle cx="100" cy="80" r="24"/>
    <circle cx="270" cy="80" r="24"/>
    <circle cx="100" cy="210" r="24"/>
    <circle cx="270" cy="210" r="24"/>
  </g>

  <!-- Labels -->
  <g font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
    <text x="100" y="80">P</text>
    <text x="270" y="80">Q</text>
    <text x="100" y="210">R</text>
    <text x="270" y="210">S</text>
  </g>
</svg>