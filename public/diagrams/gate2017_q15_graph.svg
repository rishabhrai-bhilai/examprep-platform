<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <rect width="100%" height="100%" fill="#ffffff" rx="12" />

  <!-- Edges -->
  <!-- M (100, 80) to N (250, 80) -->
  <line x1="100" y1="80" x2="250" y2="80" stroke="#1e293b" stroke-width="2.5" />
  <!-- N (250, 80) to O (400, 80) -->
  <line x1="250" y1="80" x2="400" y2="80" stroke="#1e293b" stroke-width="2.5" />

  <!-- M (100, 80) to R (100, 240) -->
  <line x1="100" y1="80" x2="100" y2="240" stroke="#1e293b" stroke-width="2.5" />
  <!-- M (100, 80) to Q (250, 240) -->
  <line x1="100" y1="80" x2="250" y2="240" stroke="#1e293b" stroke-width="2.5" />

  <!-- N (250, 80) to Q (250, 240) -->
  <line x1="250" y1="80" x2="250" y2="240" stroke="#1e293b" stroke-width="2.5" />

  <!-- O (400, 80) to Q (250, 240) -->
  <line x1="400" y1="80" x2="250" y2="240" stroke="#1e293b" stroke-width="2.5" />
  <!-- O (400, 80) to P (400, 240) -->
  <line x1="400" y1="80" x2="400" y2="240" stroke="#1e293b" stroke-width="2.5" />

  <!-- Q (250, 240) to P (400, 240) -->
  <line x1="250" y1="240" x2="400" y2="240" stroke="#1e293b" stroke-width="2.5" />

  <!-- Vertices -->
  <!-- M -->
  <circle cx="100" cy="80" r="24" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="100" y="87" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a">M</text>

  <!-- N -->
  <circle cx="250" cy="80" r="24" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="250" y="87" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a">N</text>

  <!-- O -->
  <circle cx="400" cy="80" r="24" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="400" y="87" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a">O</text>

  <!-- R -->
  <circle cx="100" cy="240" r="24" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="100" y="247" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a">R</text>

  <!-- Q -->
  <circle cx="250" cy="240" r="24" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="250" y="247" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a">Q</text>

  <!-- P -->
  <circle cx="400" cy="240" r="24" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="400" y="247" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a">P</text>
</svg>