<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <defs>
    <marker id="bptr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="leaf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Root Node [6 | 12 | 19] -->
  <g transform="translate(260, 30)">
    <rect x="0" y="0" width="200" height="44" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <line x1="66" y1="0" x2="66" y2="44" stroke="#4338ca" stroke-width="1.5"/>
    <line x1="133" y1="0" x2="133" y2="44" stroke="#4338ca" stroke-width="1.5"/>
    <text x="33" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e1b4b" text-anchor="middle">6</text>
    <text x="100" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e1b4b" text-anchor="middle">12</text>
    <text x="166" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e1b4b" text-anchor="middle">19</text>
    <text x="100" y="-10" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4338ca" text-anchor="middle">Root (Max 3 Keys: FULL)</text>
  </g>

  <!-- Tree pointer branches -->
  <line x1="280" y1="74" x2="95" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#bptr-arrow)"/>
  <line x1="335" y1="74" x2="255" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#bptr-arrow)"/>
  <line x1="385" y1="74" x2="435" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#bptr-arrow)"/>
  <line x1="440" y1="74" x2="615" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#bptr-arrow)"/>

  <!-- Leaf 1: [1, 3, 4] -->
  <g transform="translate(20, 165)">
    <rect x="0" y="0" width="150" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="100" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">1</text>
    <text x="75" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">3</text>
    <text x="125" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">4</text>
  </g>

  <!-- Leaf 2: [7, 9, 10] -->
  <g transform="translate(195, 165)">
    <rect x="0" y="0" width="150" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="100" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">7</text>
    <text x="75" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">9</text>
    <text x="125" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">10</text>
  </g>

  <!-- Leaf 3: [13, 15, 17] -->
  <g transform="translate(370, 165)">
    <rect x="0" y="0" width="150" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="100" y2="42" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">13</text>
    <text x="75" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">15</text>
    <text x="125" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">17</text>
  </g>

  <!-- Leaf 4: [20, 21, 22] -->
  <g transform="translate(545, 165)">
    <rect x="0" y="0" width="155" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <line x1="51" y1="0" x2="51" y2="42" stroke="#fca5a5" stroke-width="1.5"/>
    <line x1="103" y1="0" x2="103" y2="42" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="26" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">20</text>
    <text x="77" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">21</text>
    <text x="129" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">22</text>
    <text x="77" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">Insert 23 → Overflows!</text>
  </g>

  <!-- Sequential linked list pointers between leaves -->
  <line x1="170" y1="186" x2="190" y2="186" stroke="#10b981" stroke-width="2" marker-end="url(#leaf-arrow)"/>
  <line x1="345" y1="186" x2="365" y2="186" stroke="#10b981" stroke-width="2" marker-end="url(#leaf-arrow)"/>
  <line x1="520" y1="186" x2="540" y2="186" stroke="#10b981" stroke-width="2" marker-end="url(#leaf-arrow)"/>

  <!-- Legend / note -->
  <text x="360" y="255" font-family="system-ui, sans-serif" font-size="12" font-weight="semibold" fill="#64748b" text-anchor="middle">
    Order p = 4 (max 3 keys/node). Inserting 23 causes leaf split, which propagates and splits the root.
  </text>
</svg>
