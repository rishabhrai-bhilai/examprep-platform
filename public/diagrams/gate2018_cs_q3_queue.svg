<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="100%" height="150">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 2.5; }
      .divider { stroke: #1e293b; stroke-width: 2.5; }
      .arr { stroke: #1e293b; stroke-width: 2.5; fill: none; }
      .lbl { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 16px; font-style: italic; fill: #1e293b; }
      .dots { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 24px; font-weight: bold; fill: #1e293b; letter-spacing: 4px; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Node 1 -->
  <rect x="70" y="35" width="80" height="40" class="box" />
  <line x1="120" y1="35" x2="120" y2="75" class="divider" />
  <line x1="135" y1="55" x2="185" y2="55" class="arr" marker-end="url(#arrowhead)" />

  <!-- Head pointer -->
  <line x1="100" y1="120" x2="100" y2="85" class="arr" marker-end="url(#arrowhead)" />
  <text x="82" y="142" class="lbl">head</text>

  <!-- Node 2 -->
  <rect x="190" y="35" width="80" height="40" class="box" />
  <line x1="240" y1="35" x2="240" y2="75" class="divider" />
  <line x1="255" y1="55" x2="290" y2="55" class="arr" marker-end="url(#arrowhead)" />

  <!-- Dotted line -->
  <text x="300" y="60" class="dots">.......</text>
  <line x1="365" y1="55" x2="395" y2="55" class="arr" marker-end="url(#arrowhead)" />

  <!-- Last Node -->
  <rect x="400" y="35" width="80" height="40" class="box" />
  <line x1="450" y1="35" x2="450" y2="75" class="divider" />

  <!-- Tail pointer -->
  <line x1="435" y1="120" x2="435" y2="85" class="arr" marker-end="url(#arrowhead)" />
  <text x="424" y="142" class="lbl">tail</text>

  <!-- Ground symbol -->
  <line x1="465" y1="55" x2="510" y2="55" class="arr" />
  <line x1="510" y1="55" x2="510" y2="70" class="arr" />
  <line x1="495" y1="70" x2="525" y2="70" class="arr" />
  <line x1="500" y1="77" x2="520" y2="77" class="arr" />
  <line x1="505" y1="84" x2="515" y2="84" class="arr" />
</svg>