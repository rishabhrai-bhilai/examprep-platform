<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 380" width="450" height="380">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <g stroke="#334155" stroke-width="2.5" fill="#f8fafc">
    <!-- Top Square (Filled Circle) -->
    <rect x="175" y="30" width="70" height="70" />
    <circle cx="210" cy="65" r="16" fill="#1e293b" stroke="none" />
    
    <!-- Middle Row: 4 squares -->
    <rect x="105" y="100" width="70" height="70" />
    <rect x="175" y="100" width="70" height="70" />
    <polygon points="210,120 185,155 235,155" fill="none" stroke="#1e293b" stroke-width="3" />
    
    <rect x="245" y="100" width="70" height="70" />
    <polygon points="280,120 255,155 305,155" fill="#1e293b" stroke="none" />
    
    <rect x="315" y="100" width="70" height="70" />
    
    <!-- Bottom Square (Empty Circle) -->
    <rect x="175" y="170" width="70" height="70" />
    <circle cx="210" cy="205" r="16" fill="none" stroke="#1e293b" stroke-width="3" />
  </g>
  <text x="225" y="290" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Unfolded Cube Net</text>
  <text x="225" y="320" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">(Folding along grid lines preserves symbol face adjacencies)</text>
</svg>