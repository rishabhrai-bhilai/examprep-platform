<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="190">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 2.5; }
      .wire { stroke: #1e293b; stroke-width: 2; fill: none; }
      .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #1e293b; }
      .port { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; }
      .clk-tri { stroke: #1e293b; stroke-width: 2; fill: none; }
    </style>
    <marker id="dff-arrow-right" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e293b" />
    </marker>
    <marker id="dff-arrow-up" markerWidth="6" markerHeight="8" refX="3" refY="1" orient="auto">
      <polygon points="0 8, 3 0, 6 8" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Input wire -->
  <text x="45" y="75" class="lbl">in</text>
  <line x1="70" y1="70" x2="116" y2="70" class="wire" marker-end="url(#dff-arrow-right)" />

  <!-- FF1 Box -->
  <rect x="120" y="40" width="70" height="90" class="box" />
  <text x="128" y="75" class="port">D</text>
  <text x="168" y="75" class="port">Q</text>
  <!-- Clock triangle on bottom edge pointing upwards -->
  <polygon points="148,130 155,116 162,130" class="clk-tri" />

  <!-- Wire FF1 to FF2 -->
  <line x1="190" y1="70" x2="256" y2="70" class="wire" marker-end="url(#dff-arrow-right)" />

  <!-- FF2 Box -->
  <rect x="260" y="40" width="70" height="90" class="box" />
  <text x="268" y="75" class="port">D</text>
  <text x="308" y="75" class="port">Q</text>
  <!-- Clock triangle on bottom edge pointing upwards -->
  <polygon points="288,130 295,116 302,130" class="clk-tri" />

  <!-- Output wire -->
  <line x1="330" y1="70" x2="395" y2="70" class="wire" marker-end="url(#dff-arrow-right)" />
  <text x="402" y="75" class="lbl">out</text>

  <!-- Clock Line -->
  <text x="25" y="175" class="lbl">clock</text>
  <line x1="75" y1="170" x2="295" y2="170" class="wire" />
  
  <!-- Clock vertical tap to FF1 -->
  <line x1="155" y1="170" x2="155" y2="134" class="wire" marker-end="url(#dff-arrow-up)" />

  <!-- Clock vertical tap to FF2 -->
  <line x1="295" y1="170" x2="295" y2="134" class="wire" marker-end="url(#dff-arrow-up)" />
</svg>