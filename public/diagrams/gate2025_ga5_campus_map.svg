<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  
  <!-- Compass Rose -->
  <g transform="translate(540, 50)">
    <circle cx="0" cy="0" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="#e2e8f0"/>
    <path d="M 0 -22 L 5 -5 L 0 0 L -5 -5 Z" fill="#ef4444"/>
    <text x="0" y="-25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">N</text>
    <text x="0" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">S</text>
    <text x="32" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">E</text>
    <text x="-32" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">W</text>
  </g>

  <!-- Roads -->
  <!-- 1st Main Road (North-South) -->
  <rect x="255" y="20" width="50" height="380" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="280" y1="20" x2="280" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="280" y="395" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" transform="rotate(-90 280 210)">1st Main Road (N - S)</text>

  <!-- 5th Cross Road (East-West) -->
  <rect x="20" y="185" width="520" height="50" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="20" y1="210" x2="540" y2="210" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="140" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">5th Cross Road (W - E)</text>

  <!-- Buildings -->
  <!-- NW Quadrant -->
  <!-- Library (Top) -->
  <rect x="40" y="35" width="190" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Library</text>

  <!-- Physics Lab (Bottom of NW) -->
  <rect x="40" y="110" width="190" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="145" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Physics Lab</text>

  <!-- NE Quadrant -->
  <!-- Canteen (Top) -->
  <rect x="330" y="35" width="180" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">Canteen</text>

  <!-- Hospital (Bottom of NE) -->
  <rect x="330" y="110" width="180" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="420" y="145" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">Hospital</text>

  <!-- SW Quadrant -->
  <!-- Hostels (Top of SW) -->
  <rect x="40" y="250" width="190" height="60" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="135" y="285" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#6b21a8" text-anchor="middle">Hostels</text>

  <!-- Classrooms (Bottom of SW) -->
  <rect x="40" y="325" width="190" height="60" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="135" y="360" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#6b21a8" text-anchor="middle">Classrooms</text>

  <!-- SE Quadrant -->
  <!-- Chemistry Lab -->
  <rect x="330" y="260" width="180" height="110" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="420" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Chemistry Lab</text>
</svg>
