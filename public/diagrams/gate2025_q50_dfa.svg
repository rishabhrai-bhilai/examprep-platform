<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <defs>
    <marker id="dfa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="dfa-start-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Start Arrow -->
  <line x1="20" y1="120" x2="65" y2="120" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#dfa-start-arrow)"/>
  <text x="35" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4f46e5">Start</text>

  <!-- State q1 (Initial) -->
  <circle cx="100" cy="120" r="28" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="100" y="126" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">q₁</text>
  <!-- Self loop on q1 (a) -->
  <path d="M 90 94 C 70 50, 130 50, 110 94" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#dfa-arrow)"/>
  <text x="100" y="58" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">a</text>

  <!-- Transition q1 -> q2 (b) -->
  <line x1="128" y1="120" x2="232" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#dfa-arrow)"/>
  <text x="180" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>

  <!-- State q2 -->
  <circle cx="260" cy="120" r="28" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="260" y="126" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">q₂</text>
  <!-- Self loop on q2 (b) -->
  <path d="M 250 94 C 230 50, 290 50, 270 94" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#dfa-arrow)"/>
  <text x="260" y="58" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>

  <!-- Transition q2 -> q3 (a) -->
  <line x1="288" y1="120" x2="392" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#dfa-arrow)"/>
  <text x="340" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">a</text>

  <!-- State q3 -->
  <circle cx="420" cy="120" r="28" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="420" y="126" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">q₃</text>

  <!-- Transition q3 -> q4 (b) -->
  <line x1="448" y1="120" x2="552" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#dfa-arrow)"/>
  <text x="500" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>

  <!-- State q4 (Accepting / Double circle) -->
  <circle cx="580" cy="120" r="28" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="580" cy="120" r="22" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="580" y="126" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">q₄</text>

  <!-- Transition q3 -> q1 (a) bottom arc -->
  <path d="M 405 145 C 330 210, 190 210, 115 145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#dfa-arrow)"/>
  <text x="260" y="210" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">a</text>

  <!-- Transition q4 -> q2 (b) bottom arc -->
  <path d="M 565 145 C 500 240, 340 240, 275 145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#dfa-arrow)"/>
  <text x="420" y="235" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>
</svg>
