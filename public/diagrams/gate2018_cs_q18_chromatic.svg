<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="240">
  <defs>
    <style>
      .edge { stroke: #334155; stroke-width: 2.5; stroke-linecap: round; }
      .node { fill: #f8fafc; stroke: #1e293b; stroke-width: 2.5; }
      .lbl { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Edges -->
  <line x1="90" y1="70" x2="90" y2="230" class="edge" />
  <line x1="90" y1="70" x2="330" y2="70" class="edge" />
  <line x1="90" y1="70" x2="170" y2="150" class="edge" />
  
  <line x1="90" y1="230" x2="330" y2="230" class="edge" />
  <line x1="90" y1="230" x2="170" y2="150" class="edge" />

  <line x1="170" y1="150" x2="250" y2="150" class="edge" />

  <line x1="250" y1="150" x2="330" y2="70" class="edge" />
  <line x1="250" y1="150" x2="330" y2="230" class="edge" />

  <line x1="330" y1="70" x2="330" y2="230" class="edge" />

  <!-- Nodes -->
  <circle cx="90" cy="70" r="18" class="node" />
  <text x="90" y="70" class="lbl">a</text>

  <circle cx="90" cy="230" r="18" class="node" />
  <text x="90" y="230" class="lbl">b</text>

  <circle cx="170" cy="150" r="18" class="node" />
  <text x="170" y="150" class="lbl">c</text>

  <circle cx="250" cy="150" r="18" class="node" />
  <text x="250" y="150" class="lbl">d</text>

  <circle cx="330" cy="70" r="18" class="node" />
  <text x="330" y="70" class="lbl">e</text>

  <circle cx="330" cy="230" r="18" class="node" />
  <text x="330" y="230" class="lbl">f</text>
</svg>