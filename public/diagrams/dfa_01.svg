<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Start Arrow -->
  <line x1="20" y1="90" x2="65" y2="90" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="35" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4f46e5">Start</text>

  <!-- State q0 -->
  <circle cx="100" cy="90" r="28" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="100" y="96" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">q₀</text>

  <!-- Self loop on q0 (1) -->
  <path d="M 90 64 C 70 20, 130 20, 110 64" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">1</text>

  <!-- Transition q0 -> q1 (0) -->
  <line x1="128" y1="85" x2="232" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="76" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">0</text>

  <!-- State q1 -->
  <circle cx="260" cy="90" r="28" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="260" y="96" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">q₁</text>

  <!-- Self loop on q1 (0) -->
  <path d="M 250 64 C 230 20, 290 20, 270 64" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">0</text>

  <!-- Transition q1 -> q2 (1) -->
  <line x1="288" y1="85" x2="392" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="76" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">1</text>

  <!-- State q2 (Accepting / Double circle) -->
  <circle cx="420" cy="90" r="28" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <circle cx="420" cy="90" r="22" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="420" y="96" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">q₂</text>

  <!-- Transition q2 -> q1 (0) back curved arrow -->
  <path d="M 405 115 C 360 155, 310 155, 275 115" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="158" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">0</text>

  <!-- Transition q2 -> q0 (1) long curved arrow -->
  <path d="M 425 63 C 410 -5, 120 -5, 105 63" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">1</text>
</svg>
